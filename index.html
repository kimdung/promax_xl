
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Ảnh Promax XL</title>

<style>
:root {
    --bg: #0f172a;
    --card: #111827;
    --accent: #22c55e;
    --accent2: #3b82f6;
    --text: #e5e7eb;
    --muted: #9ca3af;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Inter", sans-serif;
    background: radial-gradient(circle at top, #1f2937, #020617);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

h2 {
    margin: 0 0 10px;
    font-size: 20px;
}

.sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    line-height: 1.5;
}

.btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 10px;
    transition: 0.2s;
}

.btn-primary {
    background: linear-gradient(135deg, var(--accent2), #60a5fa);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-1px);
}

.btn-success {
    background: linear-gradient(135deg, var(--accent), #4ade80);
    color: black;
}

.btn-success:hover {
    transform: translateY(-1px);
}

.file-label {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed #374151;
    cursor: pointer;
    margin-bottom: 15px;
    transition: 0.2s;
}

.file-label:hover {
    border-color: var(--accent2);
    background: rgba(59,130,246,0.1);
}

.type-select {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.type-select label {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #374151;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
}

.type-select input {
    display: none;
}

.type-select label:has(input:checked) {
    border-color: var(--accent2);
    background: rgba(59,130,246,0.1);
    color: var(--accent2);
    font-weight: 600;
}

.preview audio {
    width: 100%;
}

.preview {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

.circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 3px solid #1f2937;
}

.circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.radar {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: conic-gradient(rgba(34,197,94,0.5), transparent 60%);
    animation: sweep 1.5s linear infinite;
}

@keyframes sweep {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.progress {
    height: 8px;
    background: #1f2937;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #4ade80);
    transition: width 0.2s;
}

.status {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}

.percent {
    text-align: center;
    margin-top: 6px;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">
<h2>🚀 Upload ảnh Promax XL</h2>

<div id="bleWarning" style="
    display:none;
    background:#7f1d1d;
    color:#fecaca;
    padding:10px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:15px;
">
❌ Trình duyệt không hỗ trợ Bluetooth.<br>
Vui lòng dùng <b>Google Chrome</b> trên máy tính hoặc điện thoại Android.<br>
Hoặc ứng dụng <a href="https://apps.apple.com/us/app/bluefy-web-ble-browser/id1492822055"><b>Bluefy</b></a> trên iPhone
</div>


<div class="type-select">
    <label><input type="radio" name="fileType" value="image" checked>🖼️ Ảnh</label>
    <label><input type="radio" name="fileType" value="alarm">🔔 Âm thanh quá tốc độ</label>
</div>

<div class="sub" id="guide">
Trên Promax XL vào <b>Cài đặt → Ảnh khởi động</b><br>
hoặc <b>Cài đặt → Ảnh mặt đồng hồ</b><br>
Sau đó bấm lần lượt <b>1 → 2 → 3</b>
</div>

<button class="btn btn-primary" onclick="connect()">(1) Kết nối</button>

<input type="file" id="fileInput" accept="image/*" hidden>
<label for="fileInput" class="file-label" id="fileLabel">(2) Chọn ảnh (tự chuyển về JPEG 360x360)</label>

<div id="preview" class="preview"></div>

<div class="progress">
    <div class="bar" id="bar"></div>
</div>
<div id="percent" class="percent">0%</div>
<div id="status" class="status">Chưa kết nối</div>

<button class="btn btn-success" onclick="sendFile()" id="sendButton">(3) Gửi ảnh</button>

</div>

<script>

window.addEventListener("load", () => {
    if (!navigator.bluetooth) {
        const warn = document.getElementById("bleWarning");
        warn.style.display = "block";

        // disable toàn bộ nút
        document.querySelectorAll("button").forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = "0.5";
            btn.style.cursor = "not-allowed";
        });

        document.querySelector(".file-label").style.pointerEvents = "none";
        document.querySelector(".file-label").style.opacity = "0.5";

        document.getElementById("status").innerText = "Trình duyệt không hỗ trợ BLE ❌";
    }
});



let device, characteristic;
let fileBuffer = null;

const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
const WRITE_UUID   = '0000fff1-0000-1000-8000-00805f9b34fb';
const WAZE_SERVICE_UUID = '8a7e0001-4d6e-4c48-9a9d-484c504c0001';
const DEVICE_INFO_SERVICE_UUID = '0000180a-0000-1000-8000-00805f9b34fb';
const FIRMWARE_VERSION_UUID    = '00002a26-0000-1000-8000-00805f9b34fb';

// Firmware từ bản này trở lên mới hiểu "MP3_START" / "MP3_END".
// Firmware cũ bỏ qua toàn bộ (không ghi gì) nhưng web vẫn báo xong -> chặn để báo người dùng cập nhật.
const MIN_AUDIO_FW_VERSION = "2.47";

let firmwareVersion = null;   // null = chưa kết nối hoặc không đọc được

const bar = document.getElementById("bar");
const percentText = document.getElementById("percent");
const statusDiv = document.getElementById("status");
const preview = document.getElementById("preview");

// ================== LOẠI FILE ==================
// image: giữ giao thức cũ "IMG_START;<size>" -> firmware tự chọn ảnh khởi động / mặt đồng hồ theo màn hình đang mở
// alarm: "MP3_START;<size>" ... "MP3_END" -> firmware ghi vào file âm thanh báo động (cần firmware mới)
const FILE_TYPES = {
    image: {
        accept: "image/*",
        label: "(2) Chọn ảnh (tự chuyển về JPEG 360x360)",
        send: "(3) Gửi ảnh",
        guide: "Trên Promax XL vào <b>Cài đặt → Ảnh khởi động</b><br>" +
               "hoặc <b>Cài đặt → Ảnh mặt đồng hồ</b><br>" +
               "Sau đó bấm lần lượt <b>1 → 2 → 3</b>",
    },
    alarm: {
        accept: ".mp3,audio/mpeg",
        label: "(2) Chọn file âm thanh MP3 (tối đa 1MB)",
        send: "(3) Gửi âm thanh",
        guide: "Bấm lần lượt <b>1 → 2 → 3</b><br>" +
               "Cần firmware mới có hỗ trợ nhận âm thanh qua Bluetooth",
    },
};

const MAX_AUDIO_BYTES = 1024 * 1024;

const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const sendButton = document.getElementById("sendButton");
const guideDiv = document.getElementById("guide");

let fileType = "image";

function applyFileType(type) {
    fileType = type;
    const t = FILE_TYPES[type];
    fileInput.accept = t.accept;
    fileLabel.innerText = t.label;
    sendButton.innerText = t.send;
    guideDiv.innerHTML = t.guide;

    // bỏ file đã chọn của loại cũ
    loadToken++;
    fileBuffer = null;
    preview.innerHTML = "";
    bar.style.width = "0%";
    percentText.innerText = "0%";
    statusDiv.innerText = connectedStatus();
}

document.querySelectorAll('input[name="fileType"]').forEach(radio => {
    radio.addEventListener("change", () => applyFileType(radio.value));
});

function resetUI(msg = "Disconnected") {
    bar.style.width = "0%";
    percentText.innerText = "0%";
    preview.innerHTML = "";
    fileBuffer = null;
    statusDiv.innerText = msg;
    device = null;
    characteristic = null;
    firmwareVersion = null;
}

// Đọc version firmware (chuỗi APP_VERSION, ví dụ "2.46"). Không đọc được thì trả về null.
async function readFirmwareVersion(server) {
    try {
        const infoService = await server.getPrimaryService(DEVICE_INFO_SERVICE_UUID);
        const versionChar = await infoService.getCharacteristic(FIRMWARE_VERSION_UUID);
        const value = await versionChar.readValue();
        return new TextDecoder().decode(value).replace(/\0/g, "").trim();
    } catch (e) {
        console.warn("Cannot read firmware version:", e);
        return null;
    }
}

// So sánh version như số thập phân (2.1 < 2.46 < 2.47 < 2.5 < 3.0): trả về <0, 0, >0
// Version không phải số -> NaN, mọi phép so sánh đều false
function compareVersion(a, b) {
    return parseFloat(a) - parseFloat(b);
}

// Không đọc được version thì coi như firmware cũ
function supportsAudioUpload() {
    return !!firmwareVersion && compareVersion(firmwareVersion, MIN_AUDIO_FW_VERSION) >= 0;
}

function audioNotSupportedMessage() {
    return `Firmware ${firmwareVersion || "không rõ"} chưa hỗ trợ gửi âm thanh, ` +
           `cần cập nhật lên ${MIN_AUDIO_FW_VERSION} trở lên ❌`;
}

function connectedStatus() {
    if (!characteristic) return "Chưa kết nối";
    if (fileType === "alarm" && !supportsAudioUpload()) return audioNotSupportedMessage();
    return firmwareVersion ? `Connected ✅ (firmware ${firmwareVersion})` : "Connected ✅";
}

async function getServiceWithRetry(server, uuid, retry = 3) {
    for (let i = 0; i < retry; i++) {
        try {
            const service = await server.getPrimaryService(uuid);
            return service;
        } catch (e) {
            console.warn("Retry get service...", i);
            await delay(300);
        }
    }
    throw new Error("Service not found after retry");
}

async function connect() {
    try {
        console.log("🔍 Requesting device...");

       const device = await navigator.bluetooth.requestDevice({
            filters: [
                { namePrefix: "Promax" },
                { namePrefix: "VIETMAP_HUD_H50" }
            ],
            optionalServices: [SERVICE_UUID, DEVICE_INFO_SERVICE_UUID]
        });

        console.log("✅ Device selected:", device.name, device.id);

        device.addEventListener('gattserverdisconnected', () => {
            console.warn("⚠️ Device disconnected");
            resetUI("Disconnected ❌");
        });

        await delay(300); // thêm trước connect

        console.log("🔌 Connecting to GATT...");
        const server = await device.gatt.connect();
        console.log("✅ GATT connected");

        console.log("📡 Getting service:", SERVICE_UUID);
        // const service = await server.getPrimaryService(SERVICE_UUID);
        
        const service = await getServiceWithRetry(server, SERVICE_UUID);
        // services.forEach(s => console.log(s.uuid));
        // console.log("✅ Service OK");

        console.log("✍️ Getting characteristic:", WRITE_UUID);
        characteristic = await service.getCharacteristic(WRITE_UUID);
        console.log("✅ Characteristic OK");

        firmwareVersion = await readFirmwareVersion(server);
        console.log("ℹ️ Firmware version:", firmwareVersion);

        statusDiv.innerText = connectedStatus();

    } catch (e) {
        console.error("❌ Connect error:", e);

        let msg = "Connect failed ❌";

        if (e.name === "NotFoundError") {
            msg = "Không tìm thấy thiết bị ❌";
        } else if (e.name === "SecurityError") {
            msg = "Bluetooth bị chặn (HTTPS / permission) ❌";
        } else if (e.name === "NetworkError") {
            msg = "Lỗi kết nối BLE (device bận / out of range) ❌";
        } else if (e.message) {
            msg = e.message;
        }

        statusDiv.innerText = msg;
    }
}

// ================== XỬ LÝ ẢNH: tự chuyển về JPEG baseline 360x360 ==================
const IMG_SIZE = 360;
const MAX_BYTES = 512 * 1024;
const MAX_INPUT_BYTES = 30 * 1024 * 1024;

// Đọc EXIF orientation (1 = bình thường). Trả về 1 nếu không có / lỗi.
function readExifOrientation(v, tiff, end) {
    try {
        if (tiff + 8 > end) return 1;
        const le = v.getUint16(tiff) === 0x4949;              // "II" = little-endian, "MM" = big-endian
        const ifd = tiff + v.getUint32(tiff + 4, le);
        if (ifd + 2 > end) return 1;
        const cnt = v.getUint16(ifd, le);
        for (let i = 0; i < cnt; i++) {
            const e = ifd + 2 + i * 12;
            if (e + 12 > end) break;
            if (v.getUint16(e, le) === 0x0112) return v.getUint16(e + 8, le);
        }
    } catch (_) {}
    return 1;
}

// Đọc cấu trúc JPEG: loại (SOF), kích thước, số kênh, subsampling, EXIF orientation.
// Trả về null nếu không phải JPEG.
function inspectJpeg(buf) {
    const v = new DataView(buf);
    const n = v.byteLength;
    if (n < 4 || v.getUint16(0) !== 0xFFD8) return null;

    const info = { sof: 0, width: 0, height: 0, comps: 0, sampling: 0, orientation: 1 };
    let p = 2;
    while (p + 4 <= n) {
        if (v.getUint8(p) !== 0xFF) break;
        const m = v.getUint8(p + 1);
        if (m === 0xFF) { p++; continue; }                                  // byte đệm
        if (m === 0x01 || (m >= 0xD0 && m <= 0xD8)) { p += 2; continue; }  // marker không có độ dài
        if (m === 0xD9 || m === 0xDA) break;                                // EOI / SOS
        const len = v.getUint16(p + 2);
        if (len < 2 || p + 2 + len > n) break;

        if (m === 0xE1 && len >= 16 && v.getUint32(p + 4) === 0x45786966) { // "Exif"
            info.orientation = readExifOrientation(v, p + 10, p + 2 + len);
        }
        if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC && len >= 11) { // SOFn
            info.sof = m;                       // 0xC0 = baseline, 0xC2 = progressive
            info.height = v.getUint16(p + 5);
            info.width = v.getUint16(p + 7);
            info.comps = v.getUint8(p + 9);
            info.sampling = v.getUint8(p + 11); // H/V của thành phần Y (0x22 = 4:2:0)
            break;
        }
        p += 2 + len;
    }
    return info;
}

// File đã dùng được ngay trên ESP32 (TJpgDec) chưa?
function isDeviceReady(info, size) {
    return !!info &&
        info.sof === 0xC0 &&                                   // baseline; TJpgDec không đọc được progressive (0xC2)
        (info.comps === 1 || info.comps === 3) &&
        info.width === IMG_SIZE && info.height === IMG_SIZE &&
        [0x11, 0x21, 0x22].includes(info.sampling) &&          // các kiểu subsampling TJpgDec hỗ trợ
        info.orientation === 1 &&                              // có EXIF xoay thì phải vẽ lại cho đúng chiều
        size <= MAX_BYTES;
}

// ---- Phần phụ thuộc trình duyệt ----

function readAsArrayBuffer(blob) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error || new Error("Không đọc được file"));
        r.readAsArrayBuffer(blob);
    });
}

function loadImage(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Trình duyệt không đọc được ảnh này"));
        };
        img.src = url;
    });
}

function canvasToJpegBuffer(canvas, quality) {
    return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
            if (!blob) { reject(new Error("Trình duyệt không xuất được JPEG")); return; }
            readAsArrayBuffer(blob).then(resolve, reject);
        }, "image/jpeg", quality);
    });
}

// Vẽ ảnh vào canvas 360x360 (cắt giữa kiểu "cover", giống preview tròn) rồi xuất JPEG baseline
async function convertToBaseline(img) {
    if (!img.naturalWidth || !img.naturalHeight) throw new Error("Ảnh không có kích thước");

    const canvas = document.createElement("canvas");
    canvas.width = IMG_SIZE;
    canvas.height = IMG_SIZE;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);               // nền đen cho ảnh PNG/WebP trong suốt
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    const scale = Math.max(IMG_SIZE / img.naturalWidth, IMG_SIZE / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, (IMG_SIZE - dw) / 2, (IMG_SIZE - dh) / 2, dw, dh);

    for (const q of [0.92, 0.85, 0.75, 0.6, 0.45]) {
        const buf = await canvasToJpegBuffer(canvas, q);
        const info = inspectJpeg(buf);
        if (!info) throw new Error("Trình duyệt không xuất được JPEG");
        if (info.sof !== 0xC0) throw new Error("Trình duyệt tạo JPEG không phải baseline");
        if (buf.byteLength <= MAX_BYTES) return buf;
    }
    throw new Error("Không nén được ảnh xuống dưới 512KB");
}

let loadToken = 0;
let previewUrl = null;

function showPreview(buf) {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(new Blob([buf], { type: "image/jpeg" }));
    preview.innerHTML = `
        <div class="circle">
            <img src="${previewUrl}">
            <div class="radar" id="radar" style="display:none"></div>
        </div>
    `;
}

// ================== XỬ LÝ ÂM THANH ==================
// File MP3 bắt đầu bằng tag "ID3" hoặc ngay frame sync (11 bit 1)
function isMp3(buf) {
    const b = new Uint8Array(buf, 0, Math.min(3, buf.byteLength));
    if (b.length < 3) return false;
    if (b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) return true;   // "ID3"
    return b[0] === 0xFF && (b[1] & 0xE0) === 0xE0;
}

function showAudioPreview(buf) {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }));
    preview.innerHTML = `<audio controls src="${previewUrl}"></audio>`;
}

async function loadAudioFile(file) {
    if (file.size > MAX_AUDIO_BYTES) {
        statusDiv.innerText = "File âm thanh quá lớn (> 1MB) ❌";
        return;
    }
    statusDiv.innerText = "Đang đọc file...";

    const token = loadToken;
    const buf = await readAsArrayBuffer(file);
    if (token !== loadToken) return;                      // người dùng đã chọn file / loại khác

    if (!isMp3(buf)) {
        statusDiv.innerText = "File không phải MP3 ❌";
        return;
    }

    fileBuffer = buf;
    showAudioPreview(buf);
    statusDiv.innerText = `Ready ✅ (${(buf.byteLength / 1024).toFixed(1)}KB)`;
}

document.getElementById("fileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const token = ++loadToken;
    fileBuffer = null;

    if (fileType === "alarm") {
        try {
            await loadAudioFile(file);
        } catch (err) {
            console.error(err);
            if (token === loadToken) statusDiv.innerText = (err.message || "Lỗi đọc file") + " ❌";
        } finally {
            e.target.value = "";
        }
        return;
    }

    if (file.size > MAX_INPUT_BYTES) {
        statusDiv.innerText = "Ảnh quá lớn (> 30MB) ❌";
        e.target.value = "";
        return;
    }
    statusDiv.innerText = "Đang xử lý ảnh...";

    try {
        let buf = await readAsArrayBuffer(file);
        let note;

        if (isDeviceReady(inspectJpeg(buf), buf.byteLength)) {
            note = "dùng nguyên file gốc";
        } else {
            const img = await loadImage(file);
            buf = await convertToBaseline(img);
            note = "đã chuyển sang JPEG baseline 360x360";
        }
        if (token !== loadToken) return;                  // người dùng đã chọn ảnh khác

        fileBuffer = buf;
        showPreview(buf);
        statusDiv.innerText = `Ready ✅ (${note}, ${(buf.byteLength / 1024).toFixed(1)}KB)`;
    } catch (err) {
        console.error(err);
        if (token === loadToken) statusDiv.innerText = (err.message || "Lỗi xử lý ảnh") + " ❌";
    } finally {
        e.target.value = "";                              // cho phép chọn lại cùng một file
    }
};

async function sendFile() {
    if (!characteristic || !fileBuffer) {
        statusDiv.innerText = "Not ready ❌";
        return;
    }

    if (fileType === "alarm" && !supportsAudioUpload()) {
        statusDiv.innerText = audioNotSupportedMessage();
        return;
    }

    const radar = document.getElementById("radar");
    if (radar) radar.style.display = "block";

    const size = fileBuffer.byteLength;

    // ảnh giữ nguyên giao thức cũ để tương thích firmware cũ, âm thanh dùng MP3_START / MP3_END
    const isAudio = fileType === "alarm";
    const header = isAudio ? `MP3_START;${size}` : `IMG_START;${size}`;

    try {
        const startMsg = new TextEncoder().encode(header);
        await characteristic.writeValue(startMsg);

        await delay(50);

        const chunkSize = 256;

        for (let i = 0; i < size; i += chunkSize) {
            const chunk = fileBuffer.slice(i, i + chunkSize);
            await characteristic.writeValue(chunk);

            const percent = Math.floor((i / size) * 100);
            bar.style.width = percent + "%";
            percentText.innerText = percent + "%";

            await delay(10);
        }

        const endMsg = new TextEncoder().encode(isAudio ? "MP3_END" : "IMG_END");
        await characteristic.writeValue(endMsg);

        bar.style.width = "100%";
        percentText.innerText = "100%";

        statusDiv.innerText = "Done ✅";

    } catch (e) {
        statusDiv.innerText = "Send failed ❌";
        resetUI();
    }

    if (radar) radar.style.display = "none";
}

function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
}
</script>
